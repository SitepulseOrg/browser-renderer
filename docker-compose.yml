services:
  render:
    platform: linux/amd64
    init: true
    build: .
    image: browser-renderer:latest
    container_name: browser-renderer
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      RENDER_TOKEN: ${RENDER_TOKEN:?Set RENDER_TOKEN in .env}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-40}
      NAV_TIMEOUT_MS: ${NAV_TIMEOUT_MS:-30000}
      BROWSER_MAX_RENDERS: ${BROWSER_MAX_RENDERS:-1000}
      BROWSER_MAX_AGE_MS: ${BROWSER_MAX_AGE_MS:-3600000}
    shm_size: '2gb'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 130s
    deploy:
      resources:
        limits:
          memory: 7G
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - render
